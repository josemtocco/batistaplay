name: Atualizar Batista Play M3U

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Descobrir, testar e gerar M3U
        run: python atualizar.py

      - name: Mostrar resultado
        run: |
          echo "===== descobertos.json ====="
          cat descobertos.json
          echo "===== atualizacao.log ====="
          cat atualizacao.log
          echo "===== quantidade de linhas M3U ====="
          wc -l batistaplay.m3u

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add batistaplay.m3u descobertos.json atualizacao.log
          git diff --cached --quiet || git commit -m "Atualizar Batista Play M3U"
          git push
